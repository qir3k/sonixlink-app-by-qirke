name: Release SonixLink (APK & Windows x64)

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Ref to build (branch, tag or commit). Empty builds the ref this was dispatched from.
        required: false
        type: string
      publish_release_tag:
        description: Release tag to upload built artifacts to. Empty publishes under the bumped tag.
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Determine and Tag Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      old_tag: ${{ steps.version.outputs.old_tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || github.sha }}
          fetch-depth: 0

      - name: Record the revision being built
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          subject="$(git log -1 --format=%s)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building $sha: $subject"

      - name: Bump the version for a release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TAG: ${{ inputs.publish_release_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys

          custom_tag = os.environ.get("CUSTOM_TAG", "").strip()
          subprocess.run(["git", "fetch", "--tags"], check=False)
          tag_lines = subprocess.check_output(
              ["git", "tag", "-l", "v[0-9]*.[0-9]*.[0-9]*", "--sort=-v:refname"],
              text=True
          ).splitlines()

          old_tag = tag_lines[0] if tag_lines else "v1.2.0"
          m = re.match(r"^v(\d+)\.(\d+)\.(\d+)$", old_tag)
          if m:
              major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
          else:
              major, minor, patch = 1, 2, 0
              old_tag = "v1.2.0"

          head_tags = subprocess.check_output(
              ["git", "tag", "--points-at", "HEAD", "v[0-9]*.[0-9]*.[0-9]*"],
              text=True
          ).splitlines()

          if custom_tag:
              new_tag = custom_tag
              print(f"Using custom release tag: {new_tag}")
          elif head_tags:
              new_tag = head_tags[0]
              other_tags = [t for t in tag_lines if t not in head_tags]
              old_tag = other_tags[0] if other_tags else "v1.2.0"
              print(f"HEAD is already tagged: {new_tag}, comparing against {old_tag}")
          else:
              commit_msg = subprocess.check_output(["git", "log", "-1", "--pretty=%B"], text=True)

              if "#major" in commit_msg:
                  major += 1
                  minor = 0
                  patch = 0
              elif "#minor" in commit_msg:
                  minor += 1
                  patch = 0
              else:
                  if patch >= 50:
                      minor += 1
                      patch = 0
                  else:
                      patch += 1

              new_tag = f"v{major}.{minor}.{patch}"
              print(f"Bumping version: {old_tag} -> {new_tag}")

              subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
              subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
              subprocess.check_call(["git", "tag", new_tag])

              token = os.environ.get("GH_TOKEN", "")
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              if token and repo:
                  push_url = f"https://x-access-token:{token}@github.com/{repo}.git"
                  subprocess.check_call(["git", "push", push_url, new_tag])
              else:
                  subprocess.check_call(["git", "push", "origin", new_tag])

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as f:
                  f.write(f"new_tag={new_tag}\n")
                  f.write(f"old_tag={old_tag}\n")
                  f.write(f"tag={new_tag}\n")
          PY

  build-android:
    name: Build Android APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.new_tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Stamp version into app build
        env:
          TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          ver="${TAG#v}"
          echo "Updating versionName to $ver"
          sed -i "s/versionName = .*/versionName = \"$ver\"/" app/build.gradle.kts

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SONIX_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SONIX_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.SONIX_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SONIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sonixlink-release.jks"
          {
            echo "SONIX_KEYSTORE_PATH=$RUNNER_TEMP/sonixlink-release.jks"
            echo "SONIX_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "SONIX_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "SONIX_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            echo "SONIX_VERSION_CODE=$((GITHUB_RUN_NUMBER + 2))"
          } >> "$GITHUB_ENV"

      - name: Assemble Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --build-cache --stacktrace 2>&1 | tee gradle-build.log || {
            grep -A 10 "What went wrong:" gradle-build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Stage Android APK Artifact
        env:
          TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk_path="$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)"
          if [ -z "$apk_path" ] || [ ! -f "$apk_path" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found APK: $apk_path"
          cp "$apk_path" "dist/sonixlink-${TAG}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonixlink-apk
          path: dist/sonixlink-*.apk

  build-windows:
    name: Build Windows x64 Desktop
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.new_tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows Release Executable
        env:
          TAG: ${{ needs.version.outputs.new_tag }}
        shell: powershell
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target\release\sonixlink.exe" "dist\SonixLink-${env:TAG}-windows-x64.exe"
          Get-Item "dist\SonixLink-${env:TAG}-windows-x64.exe"

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: sonixlink-windows
          path: dist\SonixLink-*-windows-x64.exe

  release:
    name: Publish Release (APK + EXE)
    needs: [version, build-android, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.new_tag }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums and Release Notes
        env:
          OLD_TAG: ${{ needs.version.outputs.old_tag }}
          NEW_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          ls -la dist
          cd dist
          for f in *; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}.sha256"
            fi
          done
          cd ..
          ls -la dist

          if git rev-parse -q --verify "refs/tags/${OLD_TAG}^{commit}" >/dev/null; then
            range="${OLD_TAG}..${NEW_TAG}"
          elif git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
            range="origin/main..${NEW_TAG}"
          else
            range="${NEW_TAG} -n 20"
          fi

          {
            echo "## SonixLink ${NEW_TAG}"
            echo
            echo "### Downloads"
            echo "- 📱 **Android APK**: \`sonixlink-${NEW_TAG}.apk\`"
            echo "- 💻 **Windows 64-bit Desktop**: \`SonixLink-${NEW_TAG}-windows-x64.exe\` (Native Rust high-performance client)"
            echo
            echo "### Changes since ${OLD_TAG}:"
            echo
            git log --no-merges --invert-grep --grep='^ci:' --pretty='- %s (`%h`)' $range || true
            echo
            echo "---"
            echo "Built from \`$(git rev-parse --short "${NEW_TAG}^{commit}")\` on the \`main\` branch."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/sonixlink-*.apk
            dist/sonixlink-*.apk.sha256
            dist/SonixLink-*-windows-x64.exe
            dist/SonixLink-*-windows-x64.exe.sha256
          fail_on_unmatched_files: true
