[package]
name = "sonixlink"
version = "1.3.13"
edition = "2021"
authors = ["qirke"]
description = "SonixLink Desktop - Ultra-Fast Modern Remote Player for Windows 64-bit"

[dependencies]
eframe = "0.37.0"
libloading = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
